{% extends "base.html" %}
{% block title %}Iniciar sesión · GameHub{% endblock %}
{% block content %}
<section class="card card-body login-panel mx-auto">
  <h1 class="h3 mb-3">Iniciar sesión</h1>
  <form method="post">
    {% csrf_token %}
    {% if form.errors %}
      <p class="alert alert-danger" role="alert">Revisa el usuario y la contraseña e inténtalo nuevamente.</p>
    {% endif %}
    <div class="mb-3">
      <label for="id_username" class="form-label">Usuario</label>
      <input name="username" id="id_username" class="form-control" autocomplete="username"
             value="{{ form.username.value|default_if_none:'' }}" required autofocus>
    </div>
    <div class="mb-3">
      <label for="id_password" class="form-label">Contraseña</label>
      <input type="password" name="password" id="id_password" class="form-control"
             autocomplete="current-password" required>
    </div>
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit" class="btn btn-primary">Entrar</button>
  </form>
</section>
{% endblock %}
