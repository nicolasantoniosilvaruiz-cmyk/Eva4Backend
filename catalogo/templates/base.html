{% load static %}
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}GameHub{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/custom.css' %}">
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark catalogo-nav">
    <div class="container">
      <a class="navbar-brand" href="{% url 'catalogo:lista' %}">
        <img src="{% static 'img/gamehub.png' %}" alt="" width="36" height="36" class="gamehub-logo">
        GameHub
      </a>
      <div class="d-flex gap-2 align-items-center">
        {% if user.is_authenticated %}
          <span class="text-white">{{ user.username }}</span>
          <form method="post" action="{% url 'logout' %}">
            {% csrf_token %}
            <button type="submit" class="btn btn-outline-light">Cerrar sesión</button>
          </form>
          <a class="btn btn-success" href="{% url 'catalogo:crear' %}">Añadir juego</a>
        {% else %}
          <a class="btn btn-outline-light" href="{% url 'login' %}">Iniciar sesión</a>
        {% endif %}
      </div>
    </div>
  </nav>
  <main class="container py-4">
    {% for message in messages %}
      <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show" role="alert">
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
      </div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
